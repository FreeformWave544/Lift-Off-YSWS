<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift-Off - RSVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="height: 100vh;">
    <div id="navbar"></div>
    <div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
        <form style="font-size: 1.5rem; display: inline-flex; align-items: center; gap: 30px;">
            <label for="email">Email: </label><input type="email" id="email" name="email">
            <input type="submit" value="Sign Up!">
        </form>
    </div>
    <script type="module" src="./script.js"></script>
    <div class="cloud-noise-bg"> <svg style="display: none;"> <filter id="cloudNoise"> <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" stitchTiles="stitch"/> </filter> </svg> </div>
</body>
</html>
